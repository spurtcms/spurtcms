{{template "gshead" .}}
{{template "gsheader" .}}




<main class="flex-1 flex justify-center items-center pt-[5rem] px-4">

    <div class="max-w-[738px] w-full mx-auto relative pt-[60px]">

        <form action="/admin/getting-started/selectedcountry" method="post" id="CountryList">

            <div class="absolute top-0 left-0 h-[1px] bg-[#F5F5F5] max-w-[740px] w-full mx-auto">
                <span class="absolute t-0 l-0 h-[2px] w-[75%] bg-[#10A37F]"></span>
            </div>

            <h1 class="text-center font-bold text-3xl text-[#252525]">Which country are you in?</h1>

            <p class="text-center font-normal text-base text-[#616161] mt-3 mb-[60px]">This help us suggest template
                that
                help your team do their best work.</p>

            <div class="dropdown mb-[60px] w-full">
                <button id="selectedCountry"
                    class="dropdown-toggle border-[1px] border-[#F0F0F0] text-[#8A8A8A] rounded-md text-lg h-[66px] px-[1.25rem] text-left flex justify-between items-center w-full"
                    type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    {{if ne .userData.Country ""}}
                    {{.userData.Country}}
                    {{else}}
                    Select Country
                    {{end}}
                </button>

                <input type="hidden" name="csrf" value="{{.csrf}}">

                <input type="hidden" id="country" name="country" value="{{.userData.Country}}">

                <ul
                    class="dropdown-menu border-[1px] border-[#E6E6E6] w-full p-0 shadow-dropdown max-h-[200px] overflow-y-auto ">
                    <input type="text" placeholder="Please Choose Your Country" id="searchcatlists" name="keyword"
                        class="search border pl-10 text-[#222222] text-xs font-light w-full h-8 rounded-[3px]" />
                    {{range .CountryList}}
                    <li id="CountryList">
                        <a href="#" data-id="{{.Id}}"
                            class="countrieslist flex px-[1.25rem] py-[0.875rem]  justify-start items-center gap-2 flex-nowrap text-sm text-normal text-[#282322] hover:bg-[#F5F5F5]">
                            <span class="shrink-0 w-[1.125rem]"> </span> {{.CountryName}}
                        </a>
                    </li>
                    {{end}}
                </ul>
            </div>

            <div class="flex justify-between">
                <a href="/admin/getting-started/selectlanguage"
                    class="flex justify-center items-center border-[1px] border-[#F3F3F3] rounded-md h-[41px] w-[96px] bg-[#fff] text-[#252525] text-sm hover:bg-[#f4f4f4] transition-all duration-200">
                    <img src="/public/img/caret-left-dark.svg" alt="" class="me-2"> Back </a>
                <a href="javascript:void(0);" id="Next"
                    class="flex justify-center items-center rounded-md h-[41px] w-[96px] bg-[#10A37F] text-white text-sm hover:bg-[#047b5e] transition-all duration-200">
                    Next <img src="/public/img/caret-right-white.svg" alt="" class="ms-2"> </a>
            </div>

        </form>
    </div>

</main>

</div>



{{template "footer" .}}

<script src="/public/js/getting_started/gs_country.js"></script>

{{template "footerclose" .}}
